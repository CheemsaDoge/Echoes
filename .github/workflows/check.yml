name: Check backend and Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'backend[test]'
      - run: pytest backend/tests -q --junitxml=backend-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend-tests.xml
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get && flutter analyze lib test && flutter test test/widget/timeline_ui_and_api_test.dart
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/core/build/reports/
